name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build mod zip from git HEAD
        id: build
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="PlayerGuns-${TAG}.zip"
          # git archive produces a clean zip from the tagged commit,
          # with files at the root (no wrapping folder), which is the
          # layout BeamNG expects. .gitignored files (e.g. .zip) are skipped.
          git archive --format=zip -o "${ZIP_NAME}" HEAD
          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          ls -la "${ZIP_NAME}"

      - name: Create or update GitHub release with zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          ZIP_NAME="${{ steps.build.outputs.zip_name }}"
          # If a release already exists for this tag (e.g. created manually),
          # upload the zip to it. Otherwise create the release.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — uploading zip as new asset"
            gh release upload "${TAG}" "${ZIP_NAME}" --clobber
          else
            echo "Creating release ${TAG}"
            gh release create "${TAG}" "${ZIP_NAME}" \
              --title "${TAG}" \
              --generate-notes
          fi
