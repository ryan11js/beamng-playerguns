<div class="player-guns-hud">
  <div class="crosshair">
    <div class="cross-h"></div>
    <div class="cross-v"></div>
  </div>

  <div class="weapon-info" ng-show="weapon">
    <div class="weapon-name">{{ weapon | uppercase }}</div>
    <div class="ammo">
      <span class="mag">{{ ammo }}</span>
      <span class="sep">/</span>
      <span class="mag-size">{{ mag }}</span>
      <span class="reserve" ng-show="reserve >= 0"> &middot; {{ reserve }}</span>
    </div>
    <div class="reload-bar" ng-show="reloading">
      <div class="reload-fill" ng-style="{ width: (reloadProgress * 100) + '%' }"></div>
    </div>
  </div>
</div>

<style>
  .player-guns-hud {
    position: relative;
    width: 100%;
    height: 100%;
    color: #fff;
    font-family: 'Roboto', sans-serif;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.9);
  }
  .crosshair {
    position: absolute;
    left: 50%; top: 50%;
    width: 22px; height: 22px;
    margin-left: -11px; margin-top: -11px;
  }
  .crosshair .cross-h, .crosshair .cross-v {
    position: absolute;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 3px rgba(0,0,0,0.9);
  }
  .crosshair .cross-h {
    left: 0; right: 0; top: 50%;
    height: 2px; margin-top: -1px;
  }
  .crosshair .cross-v {
    top: 0; bottom: 0; left: 50%;
    width: 2px; margin-left: -1px;
  }
  .weapon-info {
    position: absolute;
    right: 16px; bottom: 16px;
    text-align: right;
    background: rgba(0,0,0,0.35);
    padding: 8px 12px;
    border-radius: 4px;
    min-width: 140px;
  }
  .weapon-name { font-size: 12px; letter-spacing: 2px; opacity: 0.85; }
  .ammo { font-size: 28px; font-weight: bold; line-height: 1.1; }
  .ammo .reserve { font-size: 16px; opacity: 0.7; }
  .ammo .sep { margin: 0 4px; opacity: 0.6; }
  .reload-bar {
    margin-top: 6px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px; overflow: hidden;
  }
  .reload-fill {
    height: 100%;
    background: #f0a020;
    transition: width 0.1s linear;
  }
</style>
